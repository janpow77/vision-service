[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-service"
version = "0.1.0"
description = "Vision/OCR-Microservice. Buendelt Donut, Tesseract, EasyOCR (und optional Chandra). Vom llm-router als Spoke (capability=vision/ocr) angesprochen."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "python-multipart>=0.0.9",
    # Vision/OCR
    "Pillow>=10.1",
    "pdfplumber>=0.10",
    "pdf2image>=1.17",
    "pytesseract>=0.3.10",
    # transformers >=4.50 hat einen NameError-Bug in integrations/accelerate.py
    # (nn nicht importiert). Pin auf bewaehrte 4.4x-Release wie im reranker-service.
    "transformers>=4.40,<4.50",
    # sentencepiece wird von Donut-Tokenizer gebraucht
    "sentencepiece>=0.2.0",
    "protobuf>=4.25",
    # torch wird im Dockerfile via --index-url cpu installiert; bei lokalem
    # `pip install .` ohne Index zieht es die GPU-Variante.
    "numpy>=1.26",
]

[project.optional-dependencies]
# EasyOCR ist schwergewichtig (~1 GB Torch-Models). Optional damit Tests + CI
# nicht zwangslaeufig den ganzen Stack ziehen muessen.
easyocr = [
    "easyocr>=1.7",
    "opencv-python-headless>=4.9",
]
dev = [
    "pytest>=7.4",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
