name: Image Build & Push (GHCR)

# vision-service-Image, CPU-only mit baked Donut-Modell (~3-4 GB).
# GHA-Runner haben 14 GB Disk: PyTorch (~250 MB) + Donut-Model (~800 MB) +
# Pillow/Tesseract/EasyOCR-Wheels passen, aber der GHA-Cache (10 GB pro
# Workflow) wird eng. Daher: scope-pin + mode=min.
#
# Hinweis: der erste Build dauert ~5-7 min wegen Donut-Download.

on:
  push:
    branches: [master, main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      preload_donut:
        description: "Donut-Modell vorladen (build-arg PRELOAD_DONUT)"
        type: string
        default: "naver-clova-ix/donut-base-finetuned-cord-v2"

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Free up runner disk (Donut + EasyOCR + Pillow brauchen Platz)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/boost /usr/local/share/powershell
          sudo apt-get clean
          docker image prune -af || true
          df -h / | tail -1

      - name: Tags + Labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/janpow77/vision-service
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=vision-service
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PRELOAD_DONUT=${{ inputs.preload_donut || 'naver-clova-ix/donut-base-finetuned-cord-v2' }}
          cache-from: type=gha,scope=vision-service
          cache-to: type=gha,scope=vision-service,mode=min
          provenance: false
